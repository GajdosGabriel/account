# Account na holej IP a nestandardnom porte.
#
# Dovod: sietovy filter u pouzivatela blokuje celu kategoriu Dynamic DNS,
# do ktorej sslip.io patri, takze account.78-47-38-184.sslip.io je z jeho
# siete nedostupny. Hola IP prechadza, port 8080 tiez.
#
# Bez TLS - na IP adresu sa platny certifikat vydat neda. Vhost pre
# sslip.io s Let\x27s Encrypt zostava zapnuty pre siete bez filtra.
server {
    listen 8080;
    server_name _;

    root /var/www/account/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm-account.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Debianov fastcgi_params nastavuje HTTP_HOST na $host, teda BEZ portu
        # (bezpecnostny workaround, aby sa upstream nedostala surova Host
        # hlavicka od klienta). Aplikacia na neStandardnom porte potom generuje
        # presmerovania bez portu a te skoncia na porte 80, teda v anonymizeri.
        # $host je nginxom overeny hostname, $server_port je port, na ktorom
        # realne pocuvame - klient ani jedno neovplyvni.
        fastcgi_param HTTP_HOST $host:$server_port;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/account-ip-error.log;
    access_log /var/log/nginx/account-ip-access.log;
}
