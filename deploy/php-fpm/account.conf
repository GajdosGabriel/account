; Samostatny pool pre projekt account.
; Bezi pod vlastnym uzivatelom, aby PHP kod jedneho projektu nevidel .env druheho.
[account]

user = account
group = account

listen = /run/php/php8.4-fpm-account.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand: na 2-jadrovom stroji so dvoma Laravelmi nedrzime workerov zbytocne nazivo
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.4-fpm-account.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
